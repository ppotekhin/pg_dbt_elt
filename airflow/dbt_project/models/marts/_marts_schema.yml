models:
  - name: dim_customer
    description: Измерение с клиентами
    config:
      contract:
        enforced: true
    constraints:
      - type: primary_key
        columns: [customer_id]
    columns:
      - name: customer_id
        description: id клиента (для каждого заказа создается новое id)
        data_type: varchar(255)
      - name: customer_unique_id
        description: id уникального клиента
        data_type: varchar(255)
      - name: customer_city
        description: Город клиента
        data_type: varchar(255)
      - name: customer_state
        description: Штат клиента
        data_type: varchar(255)
  - name: dim_product
    description: Измерение с товарами
    config:
      contract:
        enforced: true
    constraints:
      - type: primary_key
        columns: [product_id]
    columns:
      - name: product_id
        description: id товара
        data_type: varchar(255)
      - name: product_category_name
        description: Категория товара
        data_type: varchar(255)
  - name: dim_seller
    description: Измерение с продавцами
    config:
      contract:
        enforced: true
    constraints:
      - type: primary_key
        columns: [seller_id]
    columns:
      - name: seller_id
        description: id продавца
        data_type: varchar(255)
      - name: seller_city
        description: Город продавца
        data_type: varchar(255)
      - name: seller_state
        description: Штат продавца
        data_type: varchar(255)
  - name: fct_approvement
    description: Подтвержденные заказы
    config:
      contract:
        enforced: true
    columns:
      - name: order_approved_at
        description: Дата и время подтверждения оплаты заказа
        data_type: timestamp
      - name: order_id
        description: id заказа
        data_type: varchar(255)
      - name: product_id
        description: id товара
        data_type: varchar(255)
      - name: seller_id
        description: id продавца
        data_type: varchar(255)
      - name: customer_id
        description: id покупателя (создается новое для каждого заказа)
        data_type: varchar(255)
      - name: item_count
        description: Количество товаров в заказе
        data_type: smallint
      - name: price
        description: Стоимость товара (за 1 штуку)
        data_type: double precision
      - name: freight_value
        description: Стоимость доставки товара (за 1 штуку)
        data_type: double precision
  - name: fct_delivery
    description: Доставленные заказы
    config:
      contract:
        enforced: true
    columns:
      - name: order_delivered_customer_timestamp
        description: Дата и время доставки заказа
        data_type: timestamp
      - name: order_id
        description: id заказа
        data_type: varchar(255)
      - name: product_id
        description: id товара
        data_type: varchar(255)
      - name: seller_id
        description: id продавца
        data_type: varchar(255)
      - name: customer_id
        description: id покупателя (создается новое для каждого заказа)
        data_type: varchar(255)
      - name: item_count
        description: Количество товаров в заказе
        data_type: smallint
      - name: price
        description: Стоимость товара (за 1 штуку)
        data_type: double precision
      - name: freight_value
        description: Стоимость доставки товара (за 1 штуку)
        data_type: double precision
  - name: fct_handled
    description: Заказы принятые службой доставки
    config:
      contract:
        enforced: true
    columns:
      - name: order_delivered_carrier_timestamp
        description: Дата и время принятия заказа службой доставки
        data_type: timestamp
      - name: order_id
        description: id заказа
        data_type: varchar(255)
      - name: product_id
        description: id товара
        data_type: varchar(255)
      - name: seller_id
        description: id продавца
        data_type: varchar(255)
      - name: customer_id
        description: id покупателя (создается новое для каждого заказа)
        data_type: varchar(255)
      - name: item_count
        description: Количество товаров в заказе
        data_type: smallint
      - name: price
        description: Стоимость товара (за 1 штуку)
        data_type: double precision
      - name: freight_value
        description: Стоимость доставки товара (за 1 штуку)
        data_type: double precision
  - name: fct_purchase
    description: Оформленные заказы
    config:
      contract:
        enforced: true
    columns:
      - name: order_purchase_timestamp
        description: Дата и время оформления заказа клиентом
        data_type: timestamp
      - name: order_id
        description: id заказа
        data_type: varchar(255)
      - name: product_id
        description: id товара
        data_type: varchar(255)
      - name: seller_id
        description: id продавца
        data_type: varchar(255)
      - name: customer_id
        description: id покупателя (создается новое для каждого заказа)
        data_type: varchar(255)
      - name: item_count
        description: Количество товаров в заказе
        data_type: smallint
      - name: price
        description: Стоимость товара (за 1 штуку)
        data_type: double precision
      - name: freight_value
        description: Стоимость доставки товара (за 1 штуку)
        data_type: double precision
